<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Quote Box</title>
<style>
  * { box-sizing: border-box; }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f2f4f7;
    margin: 0;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }

  .container {
    background: #ffffff;
    max-width: 600px;
    width: 100%;
    padding: 32px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    text-align: center;
  }

  h1 { margin: 0 0 6px; font-size: 24px; color: #111827; }

  .subtitle {
    color: #6b7280;
    font-size: 14px;
    margin: 0 0 26px;
  }

  button {
    background: #2563eb;
    color: #ffffff;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #93c5fd; cursor: not-allowed; }

  .status {
    margin-top: 22px;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
    text-align: center;
  }
  .status.loading { display: block; background: #eff6ff; color: #1e40af; }
  .status.error   { display: block; background: #fef2f2; color: #b91c1c; }

  .quote-box {
    margin-top: 26px;
    padding: 24px;
    background: #fafafa;
    border-left: 5px solid #2563eb;
    border-radius: 8px;
    text-align: left;
  }

  .quote-text {
    font-size: 19px;
    font-style: italic;
    line-height: 1.5;
    color: #1f2937;
    margin: 0 0 14px;
  }

  .quote-author {
    font-size: 15px;
    color: #6b7280;
    margin: 0;
    text-align: right;
  }
</style>
</head>
<body>

  <div class="container">
    <h1>Random Quote</h1>
    <p class="subtitle">Fetched live from a public API</p>

    <button id="loadBtn">New Quote</button>

    <div id="status" class="status"></div>
    <div id="quoteBox"></div>
  </div>

<script>
  const loadBtn = document.getElementById("loadBtn");
  const statusEl = document.getElementById("status");
  const quoteBox = document.getElementById("quoteBox");

  function showStatus(message, type) {
    statusEl.textContent = message;
    statusEl.className = "status " + type;
  }

  function clearStatus() {
    statusEl.textContent = "";
    statusEl.className = "status";
  }

  loadBtn.addEventListener("click", async function () {
    // Reset UI
    quoteBox.innerHTML = "";
    clearStatus();
    loadBtn.disabled = true;
    loadBtn.textContent = "Loading...";

    // Show LOADING state
    showStatus("Loading quote, please wait...", "loading");

    try {
      // 1. Make the API request (DummyJSON - allows CORS)
      const response = await fetch("https://dummyjson.com/quotes/random");

      // 2. Check the response
      if (!response.ok) {
        throw new Error("Server returned " + response.status);
      }

      // 3. Parse the data
      const quote = await response.json();

      // 4. Display the data
      clearStatus();
      quoteBox.innerHTML =
        '<div class="quote-box">' +
          '<p class="quote-text">"' + quote.quote + '"</p>' +
          '<p class="quote-author">— ' + quote.author + '</p>' +
        '</div>';

    } catch (error) {
      // ERROR state
      clearStatus();
      showStatus("Error: " + error.message, "error");

    } finally {
      loadBtn.disabled = false;
      loadBtn.textContent = "New Quote";
    }
  });
</script>

</body>
</html>
